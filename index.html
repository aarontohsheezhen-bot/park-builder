<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>乐园建造家</title>
<meta name="description" content="离线游乐园经营游戏：铺道路、建设施、设计过山车">
<meta name="theme-color" content="#5da64a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="乐园建造家">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  /* Layout: full-bleed isometric park canvas; status pills on top, tool dock at the bottom, info sheets slide over the map */
  --ink:#1b2a41;
  --paper:#ffffff;
  --paper2:#eef5fc;
  --accent:#ff6a3d;
  --go:#21a85a;
  --gold:#ffc23d;
  --muted:#5f6f86;
  --bad:#d9443a;
  --grass:#5da64a;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass)}
body{font-family:var(--font);color:var(--ink);font-size:13px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* HUD */
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:6px;align-items:center;pointer-events:none;z-index:5}
.pill{pointer-events:auto;display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.95);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg.i{width:16px;height:16px}
.pill.icon{padding:0 8px}
.pill.money b{color:#14803c}
.pill.money.neg b{color:var(--bad)}
.spacer{flex:1}
.speed{padding:2px;gap:2px}
.speed button{min-width:30px;height:24px;border-radius:999px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}
.speed button svg.i{width:14px;height:14px}
.speed button.on{background:var(--ink);color:#fff}

#hint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 46px);max-width:min(300px,calc(100vw - 24px));background:#fff6cf;border:2px solid var(--ink);border-radius:14px;padding:8px 32px 8px 11px;font-weight:700;font-size:12.5px;line-height:1.5;box-shadow:0 3px 0 var(--ink);z-index:6}
#hint button{position:absolute;right:5px;top:5px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px}
#hint button svg.i{width:14px;height:14px}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none}
.bar{pointer-events:auto;background:rgba(255,255,255,.96);border:2px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);max-width:100%}
#tools{pointer-events:auto;display:flex;gap:2px;background:rgba(255,255,255,.96);border:2px solid var(--ink);border-radius:18px;padding:3px;box-shadow:0 3px 0 var(--ink);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tool{width:56px;height:46px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:800;flex:none}
.tool svg.i{width:20px;height:20px}
.tool.on{background:var(--ink);color:#fff}
#palette,#trackbar{pointer-events:auto;display:flex;gap:5px;overflow-x:auto;max-width:100%;padding:4px;background:rgba(255,255,255,.96);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);touch-action:pan-x;scrollbar-width:thin}
.card{flex:none;width:82px;border-radius:12px;background:var(--paper2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;padding:2px 2px 4px;gap:0}
.card.on{border-color:var(--accent);background:#fff0e9}
.card canvas{width:76px;height:46px;display:block}
.card b{font-size:11px;font-weight:800;line-height:1.25;text-align:center}
.card span{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.card.dis{opacity:.45}
#placebar,#trackstat{pointer-events:auto;display:flex;gap:6px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:5px 6px 5px 12px;box-shadow:0 3px 0 rgba(0,0,0,.25);max-width:100%;flex-wrap:wrap;justify-content:center}
#trackstat{padding:6px 12px;font-weight:700;font-size:12px;line-height:1.4;text-align:center}
#trackstat.ok{background:var(--go)}
#trackstat.err{background:var(--bad)}
.pb-why{font-size:12px;font-weight:700;max-width:260px;line-height:1.35}
.pb{height:34px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.16);font-weight:900;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pb svg.i{width:18px;height:18px}
.pb.ok{background:var(--go)}
.pb.warn{background:var(--bad)}
.pb[disabled]{opacity:.45}
.pc{flex:none;width:60px;height:58px;border-radius:12px;background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:800;line-height:1.15}
.pc svg.i{width:22px;height:22px}
.pc small{font-size:9.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.pc[disabled]{opacity:.32}
.pc.alt{background:#ffe9e0}
.pc.done{background:var(--go);color:#fff}
.pc.done small{color:#e6fff0}

/* info panel */
#panel{position:fixed;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 46px);width:min(300px,calc(100vw - 16px));max-height:calc(100% - 128px);overflow:auto;background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:11px 12px 13px;z-index:7;touch-action:pan-y;display:flex;flex-direction:column;gap:8px}
.phd{display:flex;align-items:flex-start;gap:8px}
.phd h3{margin:0;font-size:16px;font-weight:900;flex:1;line-height:1.3;text-wrap:balance}
.x{width:28px;height:28px;border-radius:9px;background:var(--paper2);display:flex;align-items:center;justify-content:center;flex:none}
.x svg.i{width:16px;height:16px}
.status{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#ddf5e6;color:#126a35}
.status.off{background:#e8edf3;color:var(--muted)}
.status.bad{background:#ffe0dc;color:#a3241b}
.status.build{background:#fff1c9;color:#7a5600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;align-items:center}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:52px 1fr 38px;gap:6px;align-items:center;font-size:12px;font-weight:700}
.meter .t{height:8px;border-radius:5px;background:#e6edf4;overflow:hidden}
.meter .t i{display:block;height:100%;border-radius:5px;background:var(--go)}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.price{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--paper2);border-radius:12px;padding:6px 8px}
.price b{font-family:var(--num);font-size:17px;font-variant-numeric:tabular-nums}
.step{width:34px;height:30px;border-radius:9px;background:#fff;border:2px solid var(--ink);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:38px;padding:0 12px;border-radius:12px;background:var(--paper2);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg.i{width:18px;height:18px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--go);color:#fff}
.btn.danger{background:#fff;color:var(--bad)}
.note{font-size:12px;color:var(--muted);font-weight:600;line-height:1.5;margin:0}
.thought{background:#fff6cf;border-radius:12px;padding:6px 10px;font-weight:700;font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);display:flex;align-items:center;justify-content:center;z-index:35;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);width:min(600px,100%);max-height:100%;overflow:auto;padding:12px 14px 14px;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;animation:pop .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet>*,#panel>*{flex-shrink:0}
.tabs{display:flex;gap:4px;background:var(--paper2);border-radius:12px;padding:3px;overflow-x:auto}
.tabs button{flex:1 0 auto;height:32px;padding:0 10px;border-radius:9px;font-weight:800;font-size:12.5px}
.tabs button.on{background:var(--ink);color:#fff}
.big-n{font-family:var(--num);font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{background:var(--paper2);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .l{font-size:11.5px;color:var(--muted);font-weight:700}
.goal li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #d6dee8;font-weight:700}
.goal ul{list-style:none;margin:0;padding:0}
.goal .ok{color:var(--go)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 4px 0;border-bottom:2px solid #d6dee8}
.chart div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%;min-width:0}
.chart i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.chart .in{background:var(--go)}
.chart .out{background:#f08a5d}
.legend{display:flex;gap:12px;font-size:11.5px;font-weight:700;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
table.fin{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.fin td{padding:4px 2px;border-bottom:1px solid #edf1f6}
table.fin td:last-child{text-align:right;font-weight:800}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--paper2);border-radius:12px;padding:6px 8px;font-weight:700}
.li span{flex:1;min-width:0}
.li b{font-variant-numeric:tabular-nums}

/* toasts */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:15;pointer-events:none;width:min(420px,calc(100vw - 32px))}
.toast{pointer-events:auto;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:12px;line-height:1.4;animation:tin .25s ease-out;text-align:center;transition:opacity .3s}
.toast.warn{background:#b8321f}
.toast.good{background:#1d8a4b}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* menu */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,rgba(18,34,64,.82),rgba(18,34,64,.45) 55%,rgba(18,34,64,.1));overflow:auto;touch-action:pan-y}
.title{display:flex;gap:2px;transform:rotate(-3deg);transform-origin:left center}
.title span{font-size:clamp(34px,min(9vh,13vw),64px);font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:bob 2.6s ease-in-out infinite}
.title span:nth-child(1){color:#ff6a3d}
.title span:nth-child(2){color:var(--gold);animation-delay:.12s}
.title span:nth-child(3){color:#7ee07a;animation-delay:.24s}
.title span:nth-child(4){color:#5fd3f5;animation-delay:.36s}
.title span:nth-child(5){color:#ff9fd0;animation-delay:.48s}
@keyframes bob{50%{transform:translateY(-5px)}}
.tag{margin:0;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.3);line-height:1.5;max-width:520px}
.scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px;max-width:780px}
.scn{background:rgba(255,255,255,.97);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.scn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.scn b{font-size:15px;font-weight:900}
.scn p{margin:0;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.45}
.scn .g{font-size:11.5px;font-weight:800;color:var(--ink)}
.scn .done{color:var(--go);font-weight:900;font-size:11.5px}
.cont{display:flex;gap:10px;flex-wrap:wrap}
.cont .btn{flex:0 0 auto;min-height:46px;font-size:16px;padding:0 20px}
.foot{margin:0;color:rgba(255,255,255,.85);font-size:12px;font-weight:700}

#rotate{position:fixed;inset:0;z-index:40;background:#14284d;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#rotate .ph{width:56px;height:96px;border:4px solid #fff;border-radius:12px;animation:turn 2s ease-in-out infinite;flex:none}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate p{margin:0;font-size:20px;font-weight:900;line-height:1.5}
#rotate small{display:block;font-size:13px;font-weight:600;opacity:.8}
#rotate button{padding:10px 18px;border-radius:12px;border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:800}
@media (orientation:portrait) and (max-width:820px){body:not(.portrait-ok) #rotate{display:flex}}
@media (max-width:640px){.pill.date{display:none}.pill{padding:0 8px}}
@media (max-height:380px){.tool{height:42px}.card canvas{height:40px}.pc{height:52px}}
@media (prefers-reduced-motion:reduce){.title span,#rotate .ph,.sheet{animation:none}}

.lang-btn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));min-height:34px;padding:0 14px;font-size:14px;z-index:2}
#menu>.title{margin-top:auto}#menu>.foot{margin-bottom:auto}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="pill money" id="hMoney"><svg data-i="coin"></svg><b id="vMoney">$0</b></div>
  <div class="pill date"><svg data-i="cal"></svg><span id="vDate"></span></div>
  <div class="pill"><svg data-i="people"></svg><span id="vGuests">0</span></div>
  <button class="pill" id="hRating" aria-label="乐园评分"><svg data-i="star"></svg><span id="vRating">500</span></button>
  <div class="pill icon" id="hWx" aria-label="天气"><svg data-i="sun"></svg></div>
  <div class="spacer"></div>
  <button class="pill icon" id="btnRot" aria-label="旋转视角"><svg data-i="rotate"></svg></button>
  <div class="pill speed" id="speed">
    <button data-sp="0" aria-label="暂停"><svg data-i="pause"></svg></button>
    <button data-sp="1">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
  </div>
  <button class="pill icon" id="btnPark" aria-label="乐园管理"><svg data-i="menu"></svg></button>
</div>

<div id="hint" hidden><span id="hintTxt"></span><button id="hintX" aria-label="关闭提示"><svg data-i="close"></svg></button></div>

<div id="dock" hidden>
  <div id="placebar" hidden></div>
  <div id="trackstat" hidden></div>
  <div id="palette" hidden></div>
  <div id="trackbar" hidden></div>
  <div id="tools">
    <button class="tool" data-tool="path"><svg data-i="path"></svg>道路</button>
    <button class="tool" data-tool="ride"><svg data-i="ride"></svg>设施</button>
    <button class="tool" data-tool="coaster"><svg data-i="coaster"></svg>过山车</button>
    <button class="tool" data-tool="shop"><svg data-i="shop"></svg>商店</button>
    <button class="tool" data-tool="scen"><svg data-i="tree"></svg>景观</button>
    <button class="tool" data-tool="terra"><svg data-i="terra"></svg>地形</button>
    <button class="tool" data-tool="staff"><svg data-i="staff"></svg>员工</button>
    <button class="tool" data-tool="bull"><svg data-i="bulldoze"></svg>拆除</button>
  </div>
</div>

<div id="panel" hidden></div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toasts" aria-live="polite"></div>

<div id="menu">
  <button id="btnLang" class="btn lang-btn" aria-label="Language">English</button>
  <div class="title" aria-label="乐园建造家"><span>乐</span><span>园</span><span>建</span><span>造</span><span>家</span></div>
  <p class="tag">铺道路、摆设施、亲手设计过山车，把空地变成人山人海的游乐园。</p>
  <div id="menuCont"></div>
  <div class="scn-grid" id="scnGrid"></div>
  <p class="foot">无需联网 · 每月自动存档</p>
</div>

<div id="rotate">
  <div class="ph"></div>
  <p>把手机横过来玩<small>横屏能看到更大的乐园</small></p>
  <button id="btnPortrait">就这样竖着玩</button>
</div>

<script id="core">

"汉堡店":"Burger Stall",
"汉堡":"a burger",
"披萨店":"Pizza Shop",
"披萨":"pizza",
"饮料店":"Drinks Stall",

}

/* ---------- helpers ---------- */
function rng(seed){let s=(seed*2654435761)>>>0||1;return ()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function inB(P,x,y){return x>=0&&y>=0&&x<P.N&&y<P.N;}
function gateIdx(P){return P.gate.y*P.N+P.gate.x;}
function blankFin(){return {gate:0,rides:0,shops:0,build:0,run:0,wage:0,stock:0,interest:0,research:0,ads:0};}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function msg(P,txt,kind,at){P.msgs.push({txt,kind:kind||'info',at:at||0,id:++P.msgSeq});if(P.msgs.length>40)P.msgs.shift();}
function afford(P,c){return P.sandbox||P.money>=c;}
function spend(P,c,cat){if(!P.sandbox)P.money-=c;P.fin[cat||'build']+=c;}
function earn(P,c,cat){P.money+=c;P.fin[cat]+=c;}
function refund(P,r){if(!P.sandbox)P.money+=r;P.fin.build-=r;}
function nbrs(P,t){const N=P.N,x=t%N,y=(t/N)|0,o=[];if(x+1<N)o.push(t+1);if(y+1<N)o.push(t+N);if(x>0)o.push(t-1);if(y>0)o.push(t-N);return o;}
function forFoot(o,f){for(let yy=o.y;yy<o.y+o.h;yy++)for(let xx=o.x;xx<o.x+o.w;xx++)f(xx,yy);}
function dateOf(P){const m=Math.floor(P.time/MONTH_SEC);const d=Math.min(30,Math.floor((P.time-m*MONTH_SEC)/MONTH_SEC*30)+1);return {y:Math.floor(m/12)+1,m:m%12+1,d};}
function rideUsable(o){return o.open&&!o.broken&&(o.kind!=='coaster'||o.ready);}
function rideValue(o){return 0.8+o.exc*1.0+Math.max(0,o.int-3)*0.35;}
function defaultPrice(exc,int){return Math.max(1,Math.round(rideValue({exc,int})*2)/2);}
function unlocked(P,id){return P.all||!!P.unl[id];}
function resName(id){const [k,v]=id.split(':');return k==='r'?RIDES[v].name:k==='s'?SHOPS[v].name:k==='t'?TRACKS[v].name:PIECES[v].name;}
function resCost(id){const [k,v]=id.split(':');return k==='r'?Math.round(50+RIDES[v].cost/70):k==='s'?40:k==='t'?110:90;}
function pathOK(P,a,b){return P.path[b]===1&&Math.abs(P.h[a]-P.h[b])<=1;}

/* ---------- park & terrain ---------- */
function newPark(scn){
  const N=scn.size,NN=N*N;
  const P={scnId:scn.id,scnName:scn.name,N,terrain:new Uint8Array(NN),h:new Uint8Array(NN),own:new Uint8Array(NN),path:new Uint8Array(NN),add:new Uint8Array(NN),
    occ:new Int32Array(NN),trk:new Int32Array(NN),tz:new Uint8Array(NN),litter:new Uint8Array(NN),scenic:new Uint8Array(NN),
    objs:{},nextId:1,guests:[],staff:[],money:scn.money,loan:0,time:0,month:0,fee:scn.fee||0,rating:500,
    gate:{x:scn.gate[0],y:scn.gate[1]},fin:blankFin(),hist:[],visitors:0,left:0,unhappyLeft:0,msgs:[],msgSeq:0,thoughts:{},
    sandbox:!!scn.sandbox,all:!!scn.all,goal:scn.goal?Object.assign({},scn.goal):null,goalState:null,seq:0,navDirty:true,
    rideList:[],shopList:[],build:0,spawnAcc:0,ratT:0,scenCount:0,
    unl:{},res:{level:2,pts:0,target:null},ads:{},wx:{k:'sun',until:MONTH_SEC*0.3}};
  for(const id of START_UNL.concat(scn.unl||[]))P.unl[id]=true;
  const r=rng(scn.seed),gx=P.gate.x,gy=P.gate.y,H=scn.hills||{amp:0,f:0.2};
  const p1=r()*6,p2=r()*6,p3=r()*6,p4=r()*6;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x;
    for(const L of scn.lakes||[]){const dx=(x+0.5-L.x)/L.rx,dy=(y+0.5-L.y)/L.ry,wob=0.18*Math.sin(x*1.7+y*0.9+scn.seed);if(dx*dx+dy*dy<1+wob)P.terrain[i]=1;}
    const n=(Math.sin(x*H.f+p1)+Math.sin(y*H.f*1.27+p2)+Math.sin((x+y)*H.f*0.71+p3)+0.6*Math.sin((x-y)*H.f*1.6+p4))/3.6;
    const dg=Math.hypot(x-gx,y-gy);
    let hh=Math.max(0,n)*H.amp*1.7*Math.min(1,Math.max(0,(dg-4)/6));
    P.h[i]=P.terrain[i]?0:Math.max(0,Math.min(MAXH,Math.round(hh)));
    if(scn.own){const o=scn.own;P.own[i]=(x>=o[0]&&y>=o[1]&&x<o[2]&&y<o[3])?1:0;}else P.own[i]=1;
  }
  for(let k=0;k<(scn.startPath||3);k++){const y=gy-k;if(y>=0){const i=y*N+gx;P.path[i]=1;P.terrain[i]=0;P.h[i]=0;P.own[i]=1;}}
  const types=['tree','pine','bush','tree','pine','rock'];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x;if(P.terrain[i]||P.path[i])continue;
    if(Math.abs(x-gx)<3&&y>gy-6)continue;
    if(r()<scn.trees*(P.own[i]?1:1.6))addObj(P,{kind:'scen',type:types[(r()*types.length)|0],x,y,w:1,h:1});
  }
  return P;
}
function addObj(P,o){o.id=P.nextId++;P.objs[o.id]=o;forFoot(o,(x,y)=>{P.occ[y*P.N+x]=o.id;});P.navDirty=true;return o;}
function nextName(P,base){const names=new Set(Object.values(P.objs).map(o=>o.name));let n=1;while(names.has(base+' '+n))n++;return base+' '+n;}
function isScen(P,i){const id=P.occ[i];return id&&P.objs[id]&&P.objs[id].kind==='scen';}
function clearScenAt(P,i){if(isScen(P,i))removeObj(P,P.objs[P.occ[i]]);}
function footWhy(P,x,y,w,h,strict){
  let h0=-1;
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
    if(!inB(P,xx,yy))return __L('超出地图范围');
    const i=yy*P.N+xx;
    if(!P.own[i])return __L('这块地还没买');
    if(P.terrain[i]===1)return __L('不能建在水上');
    if(P.path[i])return __L('这里有道路');
    if(P.occ[i]&&(strict||!isScen(P,i)))return __L('这里已经有东西了');
    if(P.trk[i])return __L('这里有过山车轨道');
    if(h0<0)h0=P.h[i];else if(P.h[i]!==h0)return __L('地面不平，先用「地形」整平');
  }
  return null;
}
function itemCost(cat,type){return cat==='ride'?RIDES[type].cost:cat==='shop'?SHOPS[type].cost:cat==='scen'?SCEN[type].cost:0;}
function footOf(cat,type,rot){if(cat!=='ride')return [1,1];const d=RIDES[type];return rot%2?[d.h,d.w]:[d.w,d.h];}
function canBuild(P,cat,type,x,y,rot){
  const [w,h]=footOf(cat,type,rot),cost=itemCost(cat,type);
  if((cat==='ride'||cat==='shop')&&!unlocked(P,(cat==='ride'?'r:':'s:')+type))return {ok:false,why:__L('还没研究出来'),w,h,cost};
  const why=footWhy(P,x,y,w,h,cat==='scen');
  if(why)return {ok:false,why,w,h,cost};
  if(!afford(P,cost))return {ok:false,why:__L('资金不足'),w,h,cost};
  return {ok:true,w,h,cost};
}
function build(P,cat,type,x,y,rot){
  const c=canBuild(P,cat,type,x,y,rot||0);
  if(!c.ok)return c;
  spend(P,c.cost,'build');
  if(cat!=='scen')for(let yy=y;yy<y+c.h;yy++)for(let xx=x;xx<x+c.w;xx++)clearScenAt(P,yy*P.N+xx);
  let o;
  if(cat==='ride'){const d=RIDES[type];o=addObj(P,{kind:'ride',type,x,y,w:c.w,h:c.h,rot:rot||0,name:nextName(P,d.name),
    price:defaultPrice(d.exc,d.int),open:true,broken:false,queue:[],riders:[],state:'idle',timer:0,t:0,runT:d.dur,rel:100,
    inc:0,lastInc:0,incTot:0,cnt:0,exc:d.exc,int:d.int,nau:d.nau,cap:d.cap,dur:d.dur,mech:0});}
  else if(cat==='shop'){const d=SHOPS[type];o=addObj(P,{kind:'shop',type,x,y,w:1,h:1,rot:0,name:nextName(P,d.name),price:d.price,
    open:true,inc:0,lastInc:0,incTot:0,cnt:0});}
  else o=addObj(P,{kind:'scen',type,x,y,w:1,h:1});
  return {ok:true,o};
}
function pathWhy(P,x,y,kind){
  if(!inB(P,x,y))return __L('超出地图范围');
  const i=y*P.N+x;
  if(!P.own[i])return __L('这块地还没买');
  if(P.path[i]===(kind||1))return __L('已经是道路了');
  if(i===gateIdx(P))return __L('入口不能改');
  if(P.terrain[i]===1)return __L('不能修在水上');
  if(P.occ[i]&&!isScen(P,i))return __L('这里有建筑');
  if(P.trk[i]&&P.tz[i]<P.h[i]+2)return __L('轨道太低，会挡住道路');
  if(!afford(P,kind===2?QUEUE_COST:PATH_COST))return __L('资金不足');
  return null;
}
function placePath(P,x,y,kind){
  kind=kind||1;const w=pathWhy(P,x,y,kind);if(w)return w;
  const i=y*P.N+x;clearScenAt(P,i);spend(P,kind===2?QUEUE_COST:PATH_COST,'build');
  P.path[i]=kind;if(kind===2)P.add[i]=0;P.navDirty=true;return null;
}
function addWhy(P,x,y,type){
  if(!inB(P,x,y))return __L('超出地图范围');
  const i=y*P.N+x;
  if(P.path[i]!==1)return __L('只能放在普通道路上');
  if(i===gateIdx(P))return __L('入口处不能放');
  if(P.add[i])return __L('这里已经放了东西');
  if(!afford(P,ADDS[type].cost))return __L('资金不足');
  return null;
}
function placeAdd(P,x,y,type){const w=addWhy(P,x,y,type);if(w)return w;spend(P,ADDS[type].cost,'build');P.add[y*P.N+x]=ADDS[type].id;P.navDirty=true;return null;}
function terraWhy(P,x,y,dir){
  if(!inB(P,x,y))return __L('超出地图范围');
  const i=y*P.N+x;
  if(!P.own[i])return __L('这块地还没买');
  if(P.terrain[i]===1)return __L('水面不能改');
  if(i===gateIdx(P))return __L('入口不能改');
  if(P.occ[i]&&!isScen(P,i))return __L('上面有建筑');
  if(P.trk[i])return __L('上面有轨道');
  const nh=P.h[i]+dir;
  if(nh<0)return __L('已经是最低了');
  if(nh>MAXH)return __L('已经是最高了');
  if(!afford(P,TERRA_COST))return __L('资金不足');
  return null;
}
function terraform(P,x,y,dir){const w=terraWhy(P,x,y,dir);if(w)return w;spend(P,TERRA_COST,'build');P.h[y*P.N+x]+=dir;P.navDirty=true;return null;}
function landWhy(P,x,y){if(!inB(P,x,y))return __L('超出地图范围');if(P.own[y*P.N+x])return __L('这块地已经是你的了');if(!afford(P,LAND_COST))return __L('资金不足');return null;}
function buyLand(P,x,y){const w=landWhy(P,x,y);if(w)return w;spend(P,LAND_COST,'build');P.own[y*P.N+x]=1;return null;}
function releaseGuests(P,o){
  for(const g of (o.queue||[]).concat(o.riders||[])){g.st='walk';g.n=-1;g.prog=0;g.t=g.qTile;g.goal=0;}
  if(o.queue)o.queue=[];if(o.riders)o.riders=[];
  if(o.state)o.state='idle';
}
function removeObj(P,o){
  releaseGuests(P,o);
  if(o.kind==='coaster'){
    for(const p of o.pieces)for(const [x,y] of pieceFoot(p,p.t)){const i=y*P.N+x;if(P.trk[i]===o.id){P.trk[i]=0;P.tz[i]=0;}}
    if(P.build===o.id)P.build=0;
  }else forFoot(o,(x,y)=>{const i=y*P.N+x;if(P.occ[i]===o.id)P.occ[i]=0;});
  delete P.objs[o.id];
  for(const s of P.staff)if(s.target===o.id)s.target=0;
  P.navDirty=true;
}
function bulldozeAt(P,x,y,dry){
  if(!inB(P,x,y))return null;
  const i=y*P.N+x;
  if(P.occ[i]){
    const o=P.objs[P.occ[i]];
    const back=o.kind==='scen'?0:Math.round(itemCost(o.kind,o.type)*0.5);
    if(!dry){removeObj(P,o);refund(P,back);}
    return {label:o.kind==='scen'?SCEN[o.type].name:o.name,refund:back,big:o.kind!=='scen'};
  }
  if(P.trk[i]){
    const c=P.objs[P.trk[i]],back=Math.round((c.spent||0)*0.5);
    if(!dry){removeObj(P,c);refund(P,back);}
    return {label:c.name,refund:back,big:true};
  }
  if(P.add[i]){const nm=ADDS[ADD_BY_ID[P.add[i]]].name;if(!dry){P.add[i]=0;P.navDirty=true;}return {label:nm,refund:0,big:false};}
  if(P.path[i]&&i!==gateIdx(P)){const q=P.path[i]===2;if(!dry){P.path[i]=0;P.litter[i]=0;P.add[i]=0;P.navDirty=true;}return {label:q?__L('排队通道'):__L('道路'),refund:0,big:false};}
  return null;
}
function setOpen(P,o,v){o.open=v;if(!v){for(const g of o.queue||[]){g.st='walk';g.n=-1;g.goal=0;g.t=g.qTile;g.skip[o.id]=P.time;}if(o.queue)o.queue=[];}}

/* ---------- navigation (paths connect when heights differ by at most 1) ---------- */
function bfs(P,src){
  const N=P.N,NN=N*N,df=new Int16Array(NN).fill(-1),q=new Int32Array(NN);let hd=0,tl=0;
  for(const s of src)if(df[s]<0){df[s]=0;q[tl++]=s;}
  while(hd<tl){
    const c=q[hd++],d=df[c]+1;
    for(const n of nbrs(P,c))if(df[n]<0&&pathOK(P,c,n)){df[n]=d;q[tl++]=n;}
  }
  return df;
}
function footTiles(P,o){
  const N=P.N,t=[];
  if(o.kind==='coaster'){for(const p of o.pieces)if(p.t==='station')t.push(p.y*N+p.x);}
  else forFoot(o,(x,y)=>t.push(y*N+x));
  return t;
}
function linkRide(P,o){
  const tiles=footTiles(P,o),own=new Set(tiles),qseen=new Set(),qline=[],adj=[],adjSeen=new Set();
  let frontier=[];
  for(const t of tiles)for(const n of nbrs(P,t)){
    if(own.has(n)||Math.abs(P.h[n]-P.h[t])>1)continue;
    if(P.path[n]===2&&!qseen.has(n)){qseen.add(n);frontier.push(n);}
    else if(P.path[n]===1&&!adjSeen.has(n)){adjSeen.add(n);adj.push(n);}
  }
  while(frontier.length){
    const nx=[];
    for(const c of frontier){qline.push(c);for(const n of nbrs(P,c))if(P.path[n]===2&&!qseen.has(n)&&Math.abs(P.h[n]-P.h[c])<=1){qseen.add(n);nx.push(n);}}
    frontier=nx;
  }
  const ent=[],es=new Set();
  for(const c of qline)for(const n of nbrs(P,c))if(P.path[n]===1&&!es.has(n)&&!own.has(n)&&Math.abs(P.h[n]-P.h[c])<=1){es.add(n);ent.push(n);}
  if(qline.length&&ent.length){o.qline=qline;o.acc=ent;o.exits=adj.length?adj:ent;o.ownExit=adj.length>0;}
  else{o.qline=null;o.acc=adj;o.exits=adj;o.ownExit=false;}
}
function rebuildNav(P){
  const N=P.N;P.rideList=[];P.shopList=[];
  P.exitDf=bfs(P,[gateIdx(P)]);
  const benches=[];for(let i=0;i<N*N;i++)if(P.add[i]===BENCH&&P.path[i]===1)benches.push(i);
  P.benchDf=benches.length?bfs(P,benches):null;
  P.scenic.fill(0);let sc=0;
  for(const o of Object.values(P.objs)){
    if(o.kind==='ride'||o.kind==='coaster'){linkRide(P,o);o.df=o.acc.length?bfs(P,o.acc):null;P.rideList.push(o);}
    else if(o.kind==='shop'){linkRide(P,o);o.qline=null;o.acc=o.exits;o.df=o.acc.length?bfs(P,o.acc):null;P.shopList.push(o);}
    else if(o.kind==='scen'){
      sc++;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=o.x+dx,y=o.y+dy;if(inB(P,x,y)){const i=y*N+x;if(P.path[i]&&P.scenic[i]<15)P.scenic[i]++;}}
    }
  }
  P.scenCount=sc;P.navDirty=false;
}
function down(P,df,t){const d=df[t],c=[];for(const n of nbrs(P,t))if(df[n]===d-1&&pathOK(P,t,n))c.push(n);return c.length?c[(Math.random()*c.length)|0]:-1;}
function wanderStep(P,e){
  const c=[];for(const n of nbrs(P,e.t))if(pathOK(P,e.t,n))c.push(n);
  if(!c.length)return -1;
  if(c.length>1){const f=c.filter(n=>n!==e.prev);if(f.length)return f[(Math.random()*f.length)|0];}
  return c[(Math.random()*c.length)|0];
}

/* ---------- guests ---------- */
function think(P,g,txt){g.th=txt;g.thT=P.time;P.thoughts[txt]=(P.thoughts[txt]||0)+1;}
function attraction(P){let a=0;for(const o of P.rideList){if(!rideUsable(o))continue;a+=o.exc+1.5+(o.kind==='coaster'?2.5:0);}return a;}
function adActive(P,k){return (P.ads[k]||0)>P.time;}
function spawnRate(P){
  const a=attraction(P);
  let r=10+a*1.8;
  r*=0.55+P.rating/1100;
  const fair=4+a*0.35;
  if(P.fee>fair)r*=Math.max(0.1,1-(P.fee-fair)/(fair+6));
  for(const k in ADS)if(adActive(P,k))r*=ADS[k].mult;
  if(P.wx.k==='rain')r*=0.6;else if(P.wx.k==='cloud')r*=0.92;
  if(P.guests.length>350)r*=Math.max(0,(650-P.guests.length)/300);
  return r;
}
function spawnGuest(P){
  const r=Math.random,gi=gateIdx(P);
  const g={id:++P.seq,name:NAMES[(r()*NAMES.length)|0],t:gi,n:-1,prev:-1,prog:0,ox:(r()-0.5)*0.55,oy:(r()-0.5)*0.55,st:'walk',goal:0,
    money:Math.round(30+r()*90),happy:62+r()*22,hunger:r()*30,thirst:r()*30,toilet:r()*20,energy:80+r()*20,nausea:0,
    iMin:r()*3.2,iMax:3.2+r()*6,tol:0.9+r()*0.5,stay:420+r()*480,age:0,rides:0,spent:0,hold:null,holdT:0,balloon:-1,umb:false,
    th:null,thT:0,shirt:(r()*10)|0,pants:(r()*4)|0,hair:(r()*5)|0,last:{},skip:{},rideId:0,qT:0,qTile:gi,timer:0,wander:0};
  const fee=adActive(P,'free')&&r()<0.5?0:P.fee;
  if(fee>0){if(g.money<fee+5)return;g.money-=fee;earn(P,fee,'gate');g.spent+=fee;}
  P.guests.push(g);P.visitors++;
}
function spawnStep(P,dt){P.spawnAcc+=spawnRate(P)/60*dt;while(P.spawnAcc>=1){P.spawnAcc-=1;spawnGuest(P);}}
function binNear(P,t){if(P.add[t]===BIN)return true;for(const n of nbrs(P,t))if(P.add[n]===BIN)return true;return false;}
function litterAt(P,t,prob,amt){if(Math.random()>prob||P.path[t]!==1||binNear(P,t))return;P.litter[t]=Math.min(9,P.litter[t]+(amt||1));}
function needs(P,g,dt){
  g.age+=dt;
  g.hunger=Math.min(100,g.hunger+0.17*dt);g.thirst=Math.min(100,g.thirst+0.22*dt);g.toilet=Math.min(100,g.toilet+0.06*dt);
  g.energy=Math.max(0,g.energy-0.055*dt);g.nausea=Math.max(0,g.nausea-0.3*dt);
  if(g.hold){g.holdT-=dt;if(g.holdT<=0){
    if(g.hold==='hunger')g.hunger=Math.max(0,g.hunger-75);else g.thirst=Math.max(0,g.thirst-80);
    g.toilet=Math.min(100,g.toilet+18);g.hold=null;litterAt(P,g.t,0.75);
  }}
  let dh=-0.03;
  if(g.hunger>85){dh-=0.25;if(Math.random()<dt*0.05)think(P,g,__L('好饿啊'));}
  if(g.thirst>85){dh-=0.25;if(Math.random()<dt*0.05)think(P,g,__L('好渴啊'));}
  if(g.toilet>88){dh-=0.35;if(Math.random()<dt*0.05)think(P,g,__L('急着上厕所！'));}
  if(g.energy<15){dh-=0.15;if(Math.random()<dt*0.03)think(P,g,__L('走得好累'));}
  if(P.wx.k==='rain'&&!g.umb&&g.st!=='ride'){dh-=0.09;if(Math.random()<dt*0.03)think(P,g,__L('下雨了，要是有把伞就好了'));}
  if(g.nausea>80&&g.st==='walk'&&Math.random()<dt*0.12){litterAt(P,g.t,1,2);g.nausea=30;g.happy-=6;think(P,g,__L('好想吐……'));}
  g.happy=Math.max(0,Math.min(100,g.happy+dh*dt));
}
function nearestShop(P,t,pred){let best=null,bd=1e9;for(const o of P.shopList){if(!o.open||!o.df||o.df[t]<0||!pred(o))continue;if(o.df[t]<bd){bd=o.df[t];best=o;}}return best;}
function needShop(P,g,t,need){return nearestShop(P,t,o=>SHOPS[o.type].need===need&&o.price<=g.money);}
function chooseGoal(P,g){
  const t=g.t;
  if(g.toilet>70){const s=needShop(P,g,t,'toilet');if(s){g.goal=s.id;return;}if(Math.random()<0.2)think(P,g,__L('找不到洗手间'));}
  if(g.hunger>60&&!g.hold){const s=needShop(P,g,t,'hunger');if(s){g.goal=s.id;return;}if(Math.random()<0.2)think(P,g,__L('好饿，可是没地方吃东西'));}
  if(g.thirst>60&&!g.hold){const s=needShop(P,g,t,'thirst');if(s){g.goal=s.id;return;}if(Math.random()<0.2)think(P,g,__L('好渴，想买饮料'));}
  if(P.wx.k==='rain'&&!g.umb&&g.money>4){const s=needShop(P,g,t,'rain');if(s){g.goal=s.id;return;}}
  if((g.energy<25||g.nausea>55)&&P.benchDf&&P.benchDf[t]>=0&&P.benchDf[t]<14){g.goal=-1;return;}
  if(g.happy<15||g.energy<6||g.age>g.stay){g.st='leave';g.goal=0;think(P,g,g.happy<15?__L('这个乐园真没意思'):__L('玩累了，回家啦'));return;}
  let best=null,bs=-1e9;
  for(const o of P.rideList){
    if(!rideUsable(o)||!o.df||o.df[t]<0)continue;
    if(o.int>g.iMax){if(Math.random()<0.01)think(P,g,o.name+__L('看起来太吓人了'));continue;}
    if((g.skip[o.id]||-1e9)>P.time-40)continue;
    if((g.last[o.id]||-1e9)>P.time-75)continue;
    if(o.price>g.money)continue;
    if(o.price>rideValue(o)*g.tol*1.25){if(Math.random()<0.15)think(P,g,o.name+__L('太贵了'));continue;}
    const s=o.exc*1.1-o.df[t]*0.07+Math.random()*2.5-o.queue.length*0.04+(o.int>=g.iMin?0.6:0)-(g.last[o.id]?1.5:0)+(adActive(P,'tv')&&o.kind==='coaster'?0.8:0);
    if(s>bs){bs=s;best=o;}
  }
  if(best){g.goal=best.id;return;}
  if(g.money>4&&g.balloon<0&&Math.random()<0.12){const s=needShop(P,g,t,'fun');if(s){g.goal=s.id;return;}}
  if(g.money<2){g.st='leave';think(P,g,__L('钱花光了'));return;}
  g.goal=0;g.wander++;
  if(g.wander>90&&Math.random()<0.05){g.st='leave';think(P,g,P.rideList.some(rideUsable)?__L('没什么好玩的了'):__L('这里什么都没有'));}
}
function maxQueue(o){return o.qline?o.cap+o.qline.length*6:o.cap*2+12;}
function enter(P,g,o){
  g.goal=0;g.wander=0;
  if(!o)return;
  if(o.kind==='shop'){
    const d=SHOPS[o.type];
    if(!o.open){think(P,g,o.name+__L('关门了'));return;}
    if(o.price>g.money){think(P,g,__L('钱不够买')+(d.item||__L('东西')));return;}
    g.money-=o.price;g.spent+=o.price;earn(P,o.price,'shops');o.inc+=o.price;o.incTot+=o.price;o.cnt++;
    if(d.unit){if(!P.sandbox)P.money-=d.unit;P.fin.stock+=d.unit;}
    if(d.need==='toilet'){g.toilet=0;g.happy=Math.min(100,g.happy+3);}
    else if(d.need==='fun'){g.balloon=(Math.random()*5)|0;g.happy=Math.min(100,g.happy+d.happy);think(P,g,__L('买到气球啦！'));}
    else if(d.need==='rain'){g.umb=true;g.happy=Math.min(100,g.happy+d.happy);think(P,g,__L('还好买了把伞'));}
    else{g.hold=d.need;g.holdT=7;if(d.happy)g.happy=Math.min(100,g.happy+d.happy);}
    g.st='shop';g.timer=1.2;return;
  }
  if(!rideUsable(o)){think(P,g,o.name+__L('没开放'));g.skip[o.id]=P.time;return;}
  if(o.price>g.money){think(P,g,__L('钱不够坐')+o.name);g.skip[o.id]=P.time;return;}
  if(o.queue.length>=maxQueue(o)){think(P,g,o.name+__L('排队的人太多了'));g.skip[o.id]=P.time;return;}
  g.st='queue';g.rideId=o.id;g.qT=0;g.qTile=g.t;o.queue.push(g);
}
function gone(P,g){g.st='gone';P.left++;if(g.happy<35)P.unhappyLeft++;}
function arrive(P,g){
  const t=g.t;
  if(P.path[t]!==1)return;
  if(g.st==='leave'){if(t===gateIdx(P))gone(P,g);return;}
  const L=P.litter[t];
  if(L){g.happy=Math.max(0,g.happy-Math.min(2,L*0.4));if(Math.random()<0.12)think(P,g,__L('地上好脏啊'));}
  const sc=P.scenic[t];
  if(sc){g.happy=Math.min(100,g.happy+Math.min(1,sc*0.12));if(sc>6&&Math.random()<0.015)think(P,g,__L('这里的风景真漂亮'));}
  if(g.goal>0){const o=P.objs[g.goal];if(!o)g.goal=0;else if(o.df&&o.df[t]===0){enter(P,g,o);return;}}
  if(g.goal===-1&&P.add[t]===BENCH){g.st='sit';g.timer=5+Math.random()*4;g.goal=0;return;}
  if(g.goal>0){const o=P.objs[g.goal];if(o&&o.kind!=='shop'&&(g.hunger>82||g.thirst>82||g.toilet>85))g.goal=0;}
}
function step(P,g){
  const t=g.t;
  if(P.path[t]!==1){const nb=nbrs(P,t).filter(n=>P.path[n]===1&&Math.abs(P.h[n]-P.h[t])<=1);if(nb.length){g.n=nb[0];return;}g.t=gateIdx(P);g.prev=-1;return;}
  if(g.st==='leave'){
    if(t===gateIdx(P)){gone(P,g);return;}
    const n=P.exitDf&&P.exitDf[t]>0?down(P,P.exitDf,t):-1;
    g.n=n>=0?n:wanderStep(P,g);return;
  }
  if(!g.goal){chooseGoal(P,g);if(g.st==='leave'){step(P,g);return;}}
  let df=null;
  if(g.goal===-1)df=P.benchDf;else if(g.goal>0){const o=P.objs[g.goal];df=o&&o.df;}
  if(df){
    const d=df[t];
    if(d===0){
      if(g.goal===-1){if(P.add[t]===BENCH){g.st='sit';g.timer=6;g.goal=0;return;}}
      else{enter(P,g,P.objs[g.goal]);if(g.st!=='walk')return;}
    }else if(d>0){const n=down(P,df,t);if(n>=0){g.n=n;return;}}
  }
  if(g.goal&&(!df||df[t]<0))g.goal=0;
  g.n=wanderStep(P,g);
}
function updGuest(P,g,dt){
  needs(P,g,dt);
  if(g.st==='ride')return;
  if(g.st==='queue'){
    g.qT+=dt;
    if(g.qT>90){const o=P.objs[g.rideId];if(o&&o.queue){const k=o.queue.indexOf(g);if(k>=0)o.queue.splice(k,1);}
      g.st='walk';g.n=-1;g.goal=0;g.t=g.qTile;g.skip[g.rideId]=P.time;g.happy=Math.max(0,g.happy-8);think(P,g,__L('排队排太久了'));}
    return;
  }
  if(g.st==='shop'||g.st==='sit'){
    g.timer-=dt;
    if(g.st==='sit'){g.energy=Math.min(100,g.energy+10*dt);g.nausea=Math.max(0,g.nausea-1.5*dt);}
    if(g.timer<=0){g.st='walk';g.n=-1;}
    return;
  }
  if(g.n<0){step(P,g);if((g.st!=='walk'&&g.st!=='leave')||g.n<0)return;}
  g.prog+=1.5*dt*(g.energy<20?0.7:1);
  if(g.prog>=1){g.prev=g.t;g.t=g.n;g.n=-1;g.prog=0;arrive(P,g);}
}

/* ---------- rides ---------- */
function updRide(P,o,dt){
  if(o.kind==='coaster'&&!o.ready)return;
  if(o.broken)return;
  if(o.state==='idle'){if(o.queue.length&&o.open){o.state='load';o.timer=3;}}
  else if(o.state==='load'){if(!o.open){o.state='idle';return;}o.timer-=dt;if(o.timer<=0||o.queue.length>=o.cap)board(P,o);}
  else if(o.state==='run'){o.t+=dt;if(o.t>=o.runT)unload(P,o);}
}
function board(P,o){
  const n=Math.min(o.cap,o.queue.length);
  for(let k=0;k<n;k++){
    const g=o.queue.shift();
    if(g.money<o.price){g.st='walk';g.n=-1;g.t=g.qTile;think(P,g,__L('钱不够了'));continue;}
    g.money-=o.price;g.spent+=o.price;earn(P,o.price,'rides');o.inc+=o.price;o.incTot+=o.price;
    g.st='ride';o.riders.push(g);
  }
  if(!o.riders.length){o.state='idle';return;}
  o.state='run';o.t=0;o.runT=o.kind==='coaster'?o.lapTime:o.dur;
}
function rideEffect(P,g,o){
  let dh=3+o.exc*1.8;
  if(o.int>g.iMax){dh*=0.4;g.nausea+=10;think(P,g,o.name+__L('太刺激了！'));}
  else if(o.int<g.iMin){dh*=0.6;think(P,g,o.name+__L('有点无聊'));}
  else think(P,g,o.name+__L('真好玩！'));
  if(o.kind==='coaster'&&o.type==='flume'&&!g.umb&&Math.random()<0.4)think(P,g,__L('全身都湿透了，好爽！'));
  g.happy=Math.min(100,g.happy+dh);
  g.nausea=Math.min(100,g.nausea+o.nau*5*(0.6+Math.random()*0.8));
  g.energy=Math.max(0,g.energy-2);g.rides++;g.last[o.id]=P.time;
}
function unload(P,o){
  const ex=o.exits&&o.exits.length?o.exits:null;
  for(const g of o.riders){rideEffect(P,g,o);g.st='walk';g.t=ex?ex[(Math.random()*ex.length)|0]:g.qTile;g.prev=-1;g.n=-1;g.prog=0;}
  o.cnt+=o.riders.length;o.riders=[];o.state='idle';
  o.rel=Math.max(20,o.rel-(0.5+Math.random()*0.8));
  if(Math.random()<(100-o.rel)/900)breakdown(P,o);
}
function breakdown(P,o){
  o.broken=true;o.state='idle';o.mech=0;
  for(const g of o.queue){g.st='walk';g.n=-1;g.goal=0;g.t=g.qTile;think(P,g,o.name+__L('坏掉了'));g.skip[o.id]=P.time;}
  o.queue=[];
  msg(P,o.name+__L('出故障了')+(P.staff.some(s=>s.type==='mech')?__L('，维修工正在赶去'):__L('，请雇一名维修工！')),'warn',o.id);
}

/* ---------- staff ---------- */
function hire(P,type){
  const n=P.staff.filter(s=>s.type===type).length+1;
  const s={id:++P.seq,type,name:STAFF[type].name+' '+n,t:gateIdx(P),n:-1,prev:-1,prog:0,st:'walk',timer:0,target:0,cheer:0,
    ox:(Math.random()-0.5)*0.4,oy:(Math.random()-0.5)*0.4};
  P.staff.push(s);return s;
}
function fire(P,id){P.staff=P.staff.filter(s=>s.id!==id);}
function seekLitter(P,t){
  const seen=new Map([[t,-1]]),q=[t];let hd=0;
  while(hd<q.length){
    const c=q[hd++];
    if(c!==t&&P.litter[c]){let x=c;while(seen.get(x)!==t)x=seen.get(x);return x;}
    if(q.length>160)break;
    for(const n of nbrs(P,c))if(pathOK(P,c,n)&&!seen.has(n)){seen.set(n,c);q.push(n);}
  }
  return -1;
}
function cheerNear(P,s){
  const N=P.N,sx=s.t%N,sy=(s.t/N)|0;
  for(const g of P.guests){
    if(g.st!=='walk'&&g.st!=='queue')continue;
    const gx=g.t%N,gy=(g.t/N)|0;
    if(Math.abs(gx-sx)+Math.abs(gy-sy)<=2){g.happy=Math.min(100,g.happy+2);if(Math.random()<0.03)think(P,g,__L('吉祥物好可爱'));}
  }
}
function staffStep(P,s){
  const t=s.t;
  if(P.path[t]!==1){const nb=nbrs(P,t).filter(n=>P.path[n]===1);if(nb.length)s.n=nb[0];else s.t=gateIdx(P);return;}
  if(s.type==='mech'){
    let o=s.target&&P.objs[s.target];
    if(!o||!o.broken){
      s.target=0;o=null;let bd=1e9;
      for(const r of P.rideList){
        if(!r.broken||!r.df||r.df[t]<0)continue;
        const taken=r.mech&&P.staff.some(x=>x.id===r.mech&&x.target===r.id&&x!==s);
        if(!taken&&r.df[t]<bd){bd=r.df[t];o=r;}
      }
      if(o){o.mech=s.id;s.target=o.id;}
    }
    if(o&&o.df){if(o.df[t]===0){s.st='work';s.timer=3.5;return;}const n=down(P,o.df,t);if(n>=0){s.n=n;return;}}
  }
  if(s.type==='janitor'){if(P.litter[t]){s.st='work';s.timer=1.2;return;}const n=seekLitter(P,t);if(n>=0){s.n=n;return;}}
  s.n=wanderStep(P,s);
}
function updStaff(P,s,dt){
  if(s.st==='work'){
    s.timer-=dt;
    if(s.timer<=0){
      s.st='walk';
      if(s.type==='janitor')P.litter[s.t]=0;
      else if(s.type==='mech'){const o=P.objs[s.target];if(o&&o.broken){o.broken=false;o.rel=95;o.mech=0;msg(P,o.name+__L('修好了'),'good',o.id);}s.target=0;}
    }
    return;
  }
  if(s.type==='mascot'){s.cheer+=dt;if(s.cheer>1){s.cheer=0;cheerNear(P,s);}}
  if(s.n<0){staffStep(P,s);if(s.st==='work'||s.n<0)return;}
  s.prog+=1.3*dt;
  if(s.prog>=1){s.prev=s.t;s.t=s.n;s.n=-1;s.prog=0;}
}

/* ---------- rating, month, research, ads, weather ---------- */
function calcRating(P){
  const gs=P.guests;let h=0;for(const g of gs)h+=g.happy;
  const avg=gs.length?h/gs.length:55;
  let r=60+avg*4,rides=0,coasters=0,broken=0;
  for(const o of P.rideList){if(o.broken)broken++;if(!rideUsable(o))continue;rides++;if(o.kind==='coaster')coasters++;}
  r+=Math.min(260,rides*30+coasters*30);
  r+=Math.min(90,P.scenCount*1.5);
  let lit=0;for(let i=0;i<P.litter.length;i++)lit+=P.litter[i];
  r-=Math.min(160,lit*1.6);r-=broken*40;r-=Math.min(120,P.unhappyLeft*3);
  if(gs.length<10)r-=(10-gs.length)*5;
  r=Math.max(0,Math.min(999,r));
  P.rating=Math.round(P.rating+(r-P.rating)*0.15);
}
function bestCoaster(P){let b=0;for(const o of Object.values(P.objs))if(o.kind==='coaster'&&o.ready)b=Math.max(b,o.exc);return b;}
function goalMet(P){const g=P.goal;if(!g)return false;if(P.guests.length<g.guests||P.rating<g.rating)return false;if(g.coaster&&bestCoaster(P)<g.coaster)return false;return true;}
function resLeft(P){return P.all?[]:RESEARCH.filter(id=>!P.unl[id]);}
function resTarget(P){const left=resLeft(P);if(!left.length)return null;if(P.res.target&&left.includes(P.res.target))return P.res.target;return left[0];}
function updResearch(P,dt){
  const lvl=P.res.level;if(!lvl)return;
  const t=resTarget(P);if(!t)return;
  P.res.pts+=RES_RATE[lvl]*dt;
  if(P.res.pts>=resCost(t)){P.unl[t]=true;P.res.pts=0;P.res.target=null;msg(P,__L('研究完成：')+resName(t)+__L(' 现在可以建造了！'),'good');}
}
function startAd(P,k){
  const a=ADS[k];if(!afford(P,a.cost))return __L('资金不足');
  spend(P,a.cost,'ads');P.ads[k]=Math.max(P.time,P.ads[k]||0)+MONTH_SEC;return null;
}
function updWeather(P){
  if(P.time<P.wx.until)return;
  const r=Math.random(),prev=P.wx.k,k=r<0.55?'sun':r<0.8?'cloud':'rain';
  P.wx={k,until:P.time+MONTH_SEC*(0.15+Math.random()*0.25)};
  if(k==='rain'&&prev!=='rain')msg(P,__L('下雨了，来的游客会变少。雨伞摊能派上用场。'));
}
function monthEnd(P){
  let run=0;
  for(const o of P.rideList)run+=o.kind==='coaster'?(o.complete?Math.round((30+o.pieces.length*2)*TRACKS[o.type].costK):0):RIDES[o.type].run;

/* ---------- coaster ---------- */

function stationWhy(P,x,y,d,type){

function newCoaster(P,x,y,d,type){

function pieceCost(c,t){const e=c.end,z1=e.z+(PIECES[t].dz||0);return Math.round((PIECES[t].cost+Math.max(e.z-c.sz,z1-c.sz,0)*8)*TRACKS[c.type].costK);}
function appendWhy(P,c,t){

  if((t==='loop'||t==='boost')&&!unlocked(P,'p:'+t))return __L('还没研究出来');
  const e=c.end,z1=e.z+(def.dz||0);

    const i=y*P.N+x;

    if(i===gateIdx(P))return __L('不能挡住入口');
    if(P.trk[i])return __L('和已有轨道重叠');

function appendPiece(P,c,t){

}
function popPiece(P,c){

function piecePoints(p,pi,out,closed){

function computeLap(P,c){

function coasterAt(c,s){
  const L=c.lapLen,n=c.pts.length;s=((s%L)+L)%L;

function sAt(c,t){

/* ---------- main tick ---------- */
function tick(P,dt){
  if(P.navDirty)rebuildNav(P);
  P.time+=dt;
  updWeather(P);updResearch(P,dt);
  spawnStep(P,dt);
  const gs=P.guests;let w=0;
  for(let k=0;k<gs.length;k++){const g=gs[k];updGuest(P,g,dt);if(g.st!=='gone')gs[w++]=g;}
  gs.length=w;
  for(const o of P.rideList)updRide(P,o,dt);
  for(const s of P.staff)updStaff(P,s,dt);
  P.ratT+=dt;if(P.ratT>=1.5){P.ratT=0;calcRating(P);}
  const m=Math.floor(P.time/MONTH_SEC);if(m>P.month){P.month=m;monthEnd(P);}
}

/* ---------- save / load ---------- */
const ARR=['terrain','h','own','path','add','litter'];
function serialize(P){
  const o={};
  for(const k in P){
    if(['occ','trk','tz','scenic','rideList','shopList','exitDf','benchDf','objs','guests','msgs'].includes(k))continue;
    o[k]=ARR.includes(k)?Array.from(P[k]):P[k];
  }
  o.objs=Object.values(P.objs).map(x=>{
    const c=Object.assign({},x);
    for(const k of ['df','acc','exits','qline','pts','cum','spd','tcum','pr'])delete c[k];
    if(c.queue)c.queue=c.queue.map(g=>g.id);if(c.riders)c.riders=c.riders.map(g=>g.id);
    return c;
  });
  o.guests=P.guests;o.v=2;
  return JSON.stringify(o);
}
function deserialize(json){
  const o=JSON.parse(json);if(o.v!==2)return null;
  const N=o.N,NN=N*N,P=Object.assign({},o);
  for(const k of ARR)P[k]=Uint8Array.from(o[k]);
  P.occ=new Int32Array(NN);P.trk=new Int32Array(NN);P.tz=new Uint8Array(NN);P.scenic=new Uint8Array(NN);
  P.objs={};P.msgs=[];P.rideList=[];P.shopList=[];P.navDirty=true;
  const gmap=new Map(P.guests.map(g=>[g.id,g]));
  for(const x of o.objs){
    if(x.queue)x.queue=x.queue.map(id=>gmap.get(id)).filter(Boolean);
    if(x.riders)x.riders=x.riders.map(id=>gmap.get(id)).filter(Boolean);
    P.objs[x.id]=x;
    if(x.kind==='coaster'){
      for(const p of x.pieces)for(const [tx,ty] of pieceFoot(p,p.t)){const i=ty*N+tx;P.trk[i]=x.id;P.tz[i]=Math.min(p.z0,p.z1);}
      if(x.complete)computeLap(P,x);
    }else forFoot(x,(tx,ty)=>{P.occ[ty*N+tx]=x.id;});
  }
  return P;
}

/* ---------- demo park (menu background + tests) ---------- */
function clearAt(P,x,y){const id=P.occ[y*P.N+x];if(id&&P.objs[id]&&P.objs[id].kind==='scen')removeObj(P,P.objs[id]);}
function makeDemo(seedShift){
  const scn=Object.assign({},SCENARIOS[0]);if(seedShift)scn.seed+=seedShift;
  const P=newPark(scn),N=P.N;P.sandbox=true;P.all=true;

const PIECE_ORDER=['straight','left','right','bigleft','bigright','lift','up','down','up2','down2','loop','boost'];
function buildTrackbar(){
  const P=A.P,c=P.objs[A.cid],tb=$('trackbar');tb.innerHTML='';
  if(!c){setMode('inspect');return;}
  const tr=K.TRACKS[c.type];

    if(!tr.pieces.includes(t))continue;

    b.innerHTML=icon('p_'+t)+esc(K.PIECES[t].name)+'<small>'+(why===__L('还没研究出来')?__L('未研究'):'$'+(c.complete?'-':K.fmt(K.pieceCost(c,t))))+'</small>';
    b.title=why||'';

  }
  const u=document.createElement('button');u.className='pc';u.innerHTML=icon('undo')+__L('撤销<small>退款</small>');u.addEventListener('click',undoPiece);tb.appendChild(u);
  const d=document.createElement('button');d.className='pc done';d.innerHTML=icon('check')+__L('完成<small>收起</small>');d.addEventListener('click',()=>finishTrackMode(true));tb.appendChild(d);
  const st=$('trackstat'),e=c.end,n=c.pieces.length-3;
  st.className='';

  else{
    const blocked=tr.pieces.every(t=>K.appendWhy(P,c,t));
    st.textContent=tr.name+__L(' · 第 ')+(n+1)+__L(' 段 · 高度 ')+e.z+(blocked?__L(' · 前方被挡住了，点「撤销」换个方向'):tr.powered?__L(' · 卡丁车道要绕回站台'):__L(' · 先用「链条提升」把车拉高，最后绕回站台后面的白圈'));

function addPiece(t){

function undoPiece(){

/* ---------- pointer input ---------- */
function fingerActs(){return A.mode==='path'||A.mode==='place'||A.mode==='station'||A.mode==='terra'||A.mode==='land';}
function fingerAct(px,py){
  const P=A.P,t=tileAt(px,py);if(!t)return;
  const i=t.y*P.N+t.x;
  if(A.mode==='path'){
    if(i===A.lastPath)return;A.lastPath=i;
    const w=K.placePath(P,t.x,t.y,A.cat==='queue'?2:1);
    if(w&&w!==__L('已经是道路了'))toastOnce('path'+w,w,'warn');
  }else if(A.mode==='terra'||A.mode==='land'){
    if(!A.painted)A.painted=new Set();if(A.painted.has(i))return;A.painted.add(i);
    const w=A.mode==='land'?K.buyLand(P,t.x,t.y):K.terraform(P,t.x,t.y,A.item==='up'?1:-1);
    if(w&&w!==__L('这块地已经是你的了'))toastOnce('tf'+w,w,'warn');
  }else if(A.mode==='place'){
    const [w,h]=K.footOf(A.cat,A.item,A.rot),g={x:Math.floor(t.fx-w/2+0.5),y:Math.floor(t.fy-h/2+0.5)};
    if(!A.ghost||g.x!==A.ghost.x||g.y!==A.ghost.y){A.ghost=g;syncPlacebar();}
  }else if(A.mode==='station'){
    if(!A.ghost||t.x!==A.ghost.x||t.y!==A.ghost.y){A.ghost={x:t.x,y:t.y};syncPlacebar();}
  }
}
function onTap(px,py){
  const P=A.P,t=tileAt(px,py);if(!t)return;
  if(A.mode==='add'){const w=K.placeAdd(P,t.x,t.y,A.item);if(w)toastOnce('add'+w,w,'warn');return;}
  if(A.mode==='scen'){const r=K.build(P,'scen',A.item,t.x,t.y,0);if(!r.ok)toastOnce('scen'+r.why,r.why,'warn');return;}
  if(A.mode==='bull'){
    const info=K.bulldozeAt(P,t.x,t.y,true);
    if(!info){toastOnce('bn',__L('这里没有可以拆的东西'));return;}
    if(info.big){A.bullPend={x:t.x,y:t.y,info};syncPlacebar();}
    else{K.bulldozeAt(P,t.x,t.y,false);A.bullPend=null;syncPlacebar();}
    return;
  }
  if(A.mode==='inspect'){
    const w=screenToWorld(px,py);let pick=null;
    for(let k=A.hits.length-1;k>=0;k--){const h=A.hits[k];if(h.small&&w.x>=h.x0&&w.x<=h.x1&&w.y>=h.y0&&w.y<=h.y1){pick=h.ref;break;}}
    if(!pick)for(let k=A.hits.length-1;k>=0;k--){const h=A.hits[k];if(!h.small&&w.x>=h.x0&&w.x<=h.x1&&w.y>=h.y0&&w.y<=h.y1){pick=h.ref;break;}}
    if(!pick&&t.x>=0&&t.y>=0&&t.x<P.N&&t.y<P.N){const i=t.y*P.N+t.x;const id=P.occ[i]||P.trk[i];if(id&&P.objs[id]&&P.objs[id].kind!=='scen')pick={kind:'obj',id};}
    if(pick)openPanel(pick);else closePanel();
  }
}
function startPinch(){const [a,b]=[...A.ptr.values()];A.pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z:A.cam.z,cx:A.cam.x,cy:A.cam.y};A.camGoal=null;}
function updPinch(){
  const [a,b]=[...A.ptr.values()],pz=A.pinch,d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const nz=Math.max(0.35,Math.min(2.6,pz.z*d/pz.d)),wx=(pz.mx-CW/2)/pz.z+pz.cx,wy=(pz.my-CH/2)/pz.z+pz.cy;
  A.cam.z=nz;A.cam.x=wx-(mx-CW/2)/nz;A.cam.y=wy-(my-CH/2)/nz;clampCam();
}
cv.addEventListener('pointerdown',e=>{
  if(!A.P||A.scr!=='game')return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  A.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false});
  if(A.ptr.size===2){startPinch();A.drag=null;return;}
  if(A.ptr.size>2)return;
  const pan=e.button===1||e.button===2||!fingerActs();
  A.drag={id:e.pointerId,pan};A.lastPath=-1;A.painted=null;
  if(!pan)fingerAct(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  if(A.scr!=='game'||!A.P)return;
  const p=A.ptr.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'&&(A.mode==='place'||A.mode==='station'))fingerAct(e.clientX,e.clientY);return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(p.x-p.sx,p.y-p.sy)>8)p.moved=true;
  if(A.pinch&&A.ptr.size>=2){updPinch();return;}
  if(!A.drag||A.drag.id!==e.pointerId)return;
  if(A.drag.pan){if(p.moved){A.cam.x-=dx/A.cam.z;A.cam.y-=dy/A.cam.z;A.camGoal=null;clampCam();}}
  else{const list=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ce of (list.length?list:[e]))fingerAct(ce.clientX,ce.clientY);}
});
function ptrEnd(e){
  const p=A.ptr.get(e.pointerId);if(!p)return;A.ptr.delete(e.pointerId);
  if(A.pinch){if(A.ptr.size<2)A.pinch=null;A.drag=null;return;}
  if(A.drag&&A.drag.id===e.pointerId){if(!p.moved&&performance.now()-p.t<500&&e.type==='pointerup')onTap(p.x,p.y);A.drag=null;A.lastPath=-1;A.painted=null;}
}
cv.addEventListener('pointerup',ptrEnd);
cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{
  if(A.scr!=='game')return;e.preventDefault();
  const w=screenToWorld(e.clientX,e.clientY);A.cam.z=Math.max(0.35,Math.min(2.6,A.cam.z*Math.exp(-e.deltaY*0.0015)));
  A.cam.x=w.x-(e.clientX-CW/2)/A.cam.z;A.cam.y=w.y-(e.clientY-CH/2)/A.cam.z;A.camGoal=null;clampCam();
},{passive:false});

function refreshSheet(){
  const P=A.P;if(!P||$('modal').hidden)return;
  const avg=P.guests.length?P.guests.reduce((s,g)=>s+g.happy,0)/P.guests.length:0;
  const v={rating:P.rating,ratingTxt:P.rating>=800?__L('口碑极好'):P.rating>=650?__L('很受欢迎'):P.rating>=500?__L('还不错'):P.rating>=350?__L('一般般'):__L('很差'),guests:P.guests.length,visitors:__L('累计 ')+K.fmt(P.visitors)+__L(' 人次'),
    money:money(P.money),loan:P.loan?__L('贷款 $')+K.fmt(P.loan):__L('无贷款'),avg:Math.round(avg),fee:'$'+P.fee,loanAmt:'$'+K.fmt(P.loan)};
  const tg=K.resTarget(P);if(tg){const c=K.resCost(tg);v.resp=Math.round(P.res.pts/c*100);const r=K.RES_RATE[P.res.level];v.reseta=r?__L('大约还要 ')+Math.max(1,Math.ceil((c-P.res.pts)/r/K.MONTH_SEC*30))+__L(' 天'):__L('研究已暂停');}
  for(const k in K.ADS){const u=P.ads[k]||0;v['ad_'+k]=u>P.time?__L('进行中，还剩 ')+Math.ceil((u-P.time)/K.MONTH_SEC*30)+__L(' 天'):'';}
  if(P.goal){const g=P.goal;v.g1=(P.guests.length>=g.guests?'✓ ':'')+P.guests.length+'/'+g.guests;v.g2=(P.rating>=g.rating?'✓ ':'')+P.rating+'/'+g.rating;
    if(g.coaster)v.g3=(K.bestCoaster(P)>=g.coaster?'✓ ':'')+K.bestCoaster(P).toFixed(2);
    v.gstate=P.goalState==='won'?__L('目标已完成！'):P.goalState==='lost'?__L('时间已过，目标没完成。可以继续经营。'):__L('每月底检查一次，三项同时满足就算完成。');}

  $('sheet').querySelectorAll('.goal [data-f]').forEach(el=>el.classList.toggle('ok',el.textContent.startsWith('✓')));
}
$('sheet').addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){sheetTab=tb.dataset.tab;renderSheet();return;}
  const b=e.target.closest('[data-act]');if(!b)return;const P=A.P,act=b.dataset.act;
  if(act==='close')closeSheet();
  else if(act==='fee'){P.fee=Math.max(0,Math.min(60,P.fee+parseInt(b.dataset.v,10)));refreshSheet();}
  else if(act==='loan'){const w=K.setLoan(P,parseInt(b.dataset.v,10));if(w)toast(w,'warn');refreshSheet();}
  else if(act==='resLvl'){P.res.level=+b.dataset.v;renderSheet();}
  else if(act==='resPick'){P.res.target=b.dataset.v;P.res.pts=0;renderSheet();toast(__L('下一项研究：')+K.resName(b.dataset.v));}
  else if(act==='ad'){const w=K.startAd(P,b.dataset.v);if(w)toast(w,'warn');else toast(__L('「')+K.ADS[b.dataset.v].name+__L('」已经开始投放'),'good');refreshSheet();}
  else if(act==='hire'){K.hire(P,b.dataset.v);toast(__L('雇了一名')+K.STAFF[b.dataset.v].name,'good');renderSheet();}
  else if(act==='fireS'){K.fire(P,parseInt(b.dataset.v,10));renderSheet();}
  else if(act==='save'){saveGame(true);}
  else if(act==='lang'){setLang(__LANG==='en'?'zh':'en');}
  else if(act==='slotSave'){saveSlot(+b.dataset.v);renderSheet();}
  else if(act==='slotLoad'){askLoadSlot(+b.dataset.v);}
  else if(act==='pixel'){A.pixel=A.pixel===false;meta.pixel=A.pixel;putMeta();renderSheet();}
  else if(act==='menu'){saveGame(false);closeSheet();showMenu();}
  else if(act==='goalMenu'){closeSheet();showMenu();}
});

/* ---------- HUD, hints, messages ---------- */
function updateHUD(){
  const P=A.P;if(!P||A.scr!=='game')return;
  $('vMoney').textContent=money(P.money);$('hMoney').classList.toggle('neg',!P.sandbox&&P.money<0);
  const d=K.dateOf(P);$('vDate').textContent=fmtDate(d);
  $('vGuests').textContent=P.guests.length;$('vRating').textContent=P.rating;
  if(A.wxShown!==P.wx.k){A.wxShown=P.wx.k;$('hWx').innerHTML=icon(P.wx.k);$('hWx').setAttribute('aria-label',{sun:__L('晴天'),cloud:__L('多云'),rain:__L('下雨')}[P.wx.k]);}
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.sp===A.speed));
}
function hintText(P){
  if(P.sandbox)return null;
  let paths=0;for(const v of P.path)paths+=v;
  const rides=P.rideList.filter(o=>o.kind==='ride').length,need=n=>P.shopList.some(o=>K.SHOPS[o.type].need===n);
  if(paths<10)return ['p',__L('第一步：点下方「道路」，按住屏幕拖动，从入口往里铺路。双指可以移动和缩放地图。')];
  if(!rides)return ['r',__L('第二步：点「设施」选一个游乐设施，挪到道路旁边，再点「建造」。')];
  if(!need('hunger')||!need('thirst'))return ['s',__L('游客会饿会渴：在「商店」里建汉堡店和饮料店，也要挨着道路。')];
  if(!need('toilet'))return ['t',__L('再建一个洗手间，不然游客会憋得很难受。')];
  if(!P.staff.length)return ['st',__L('在「员工」里雇清洁工和维修工：地面干净、设施有人修，评分才会高。')];
  {let lit=0;for(let i=0;i<P.litter.length;i++)lit+=P.litter[i];const jan=P.staff.filter(s=>s.type==='janitor').length;
   if(lit>20&&jan<1+P.guests.length/80)return ['lit'+jan,__L('地上垃圾越来越多，评分在往下掉。多雇几个清洁工，路边放些垃圾桶，游客才不会走掉。')];}
  if(!P.rideList.some(o=>o.qline))return ['q',__L('在「道路」里选「排队通道」，从设施门口铺到道路上，游客会排成整齐的队。')];
  if(!P.rideList.some(o=>o.kind==='coaster'))return ['c',__L('准备好了就点「过山车」，选一种类型，自己设计一条轨道！')];
  if(P.res.level===0&&K.resLeft(P).length)return ['r',__L('研究已经暂停了。在「乐园 → 研究」里打开，才能解锁新设施。')];
  return null;
}
let hintKey=null;const hintOff={};
function updateHint(){
  const P=A.P;const h=A.scr==='game'&&P?hintText(P):null;
  if(!h||hintOff[h[0]]||A.mode==='track'){$('hint').hidden=true;hintKey=h&&h[0];return;}
  if(hintKey!==h[0]||$('hint').hidden){hintKey=h[0];$('hintTxt').textContent=h[1];$('hint').hidden=false;}
}
$('hintX').addEventListener('click',()=>{if(hintKey)hintOff[hintKey]=1;$('hint').hidden=true;});
function drainMsgs(){
  const P=A.P;if(!P||A.scr!=='game')return;
  for(const m of P.msgs)if(m.id>A.msgSeen){A.msgSeen=m.id;toast(m.txt,m.kind==='warn'?'warn':m.kind==='good'?'good':null,3400);}
  if(P.goalState&&!P.goalShown){P.goalShown=true;showGoal(P);}
}
function showGoal(P){
  const won=P.goalState==='won';
  if(won){meta.done[P.scnId]=true;putMeta();}
  sheetTab='overview';
  $('sheet').innerHTML='<div class="phd"><h3>'+(won?__L('目标达成！'):__L('时间到了'))+'</h3></div><p class="note" style="font-size:14px">'+
    (won?__L('恭喜！「')+esc(P.scnName)+__L('」现在有 ')+P.guests.length+__L(' 位游客，评分 ')+P.rating+__L('。你可以继续经营，或者挑战下一张地图。'):__L('第 ')+P.goal.year+__L(' 年底没有完成目标。乐园还在，可以继续经营，也可以从头再来。'))+
    __L('</p><div class="row"><button class="btn primary" data-act="close">继续经营</button><button class="btn" data-act="goalMenu">')+icon('home')+__L('回主菜单</button></div>');
  $('modal').hidden=false;

  const m=slotMeta(i);if(!m)return;
  $('sheet').innerHTML=__L('<div class="phd"><h3>读取存档 ')+i+__L('？</h3></div><p class="note" style="font-size:14px">')+esc(__tr(m.name))+' · '+fmtDate(m)+'</p>'+
    (A.scr==='game'?__L('<p class="note" style="font-size:14px">现在的乐园没另存到槽位的话，进度会被替换掉。</p>'):'')+
    __L('<div class="row"><button class="btn primary" id="okSlot">读取</button><button class="btn" data-act="close">取消</button></div>');
  $('modal').hidden=false;
  $('okSlot').addEventListener('click',()=>{let P=null;try{const s=localStorage.getItem(SLOT_KEY(i));P=s?__relabel(K.deserialize(s)):null;}catch(e){}
    if(!P){toast(__L('这个存档读不出来了'),'warn');return;}closeSheet();tryFullscreen();startGame(P);toast(__L('已读取存档 ')+i,'good');});
}
function setLang(l){
  saveGame(false);
  try{localStorage.setItem('park-builder-lang',l);}catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search+'#lang='+l);}catch(e){location.hash='lang='+l;}
  location.reload();
}

/* ---------- menu ---------- */
function tryFullscreen(){
  if(A.fsTried||!matchMedia('(pointer:coarse)').matches)return;A.fsTried=true;
  try{const el=document.documentElement,p=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):null;
    if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}
}
function showMenu(){
  A.scr='menu';closePanel();closeSheet();A.tool=null;A.mode='inspect';
  $('hud').hidden=true;$('dock').hidden=true;$('hint').hidden=true;$('menu').hidden=false;
  if(!A.demoPark){A.demoPark=K.makeDemo(7);A.demoPark.wx={k:'sun',until:1e9};for(let i=0;i<2400;i++)K.tick(A.demoPark,0.05);}
  RV=0;order=null;RN=A.demoPark.N;
  A.P=A.demoPark;A.anim={};A.cam.z=CW<700?0.62:0.8;centerOn(14,13);
  const saved=loadSave(),mc=$('menuCont');mc.innerHTML='';
  if(saved){const d=K.dateOf(saved);const b=document.createElement('div');b.className='cont';
    b.innerHTML='<button class="btn primary" id="btnCont">'+icon('play')+__L('继续：')+esc(saved.scnName)+' · '+fmtDate(d,true)+'</button>';mc.appendChild(b);
    $('btnCont').addEventListener('click',()=>{tryFullscreen();startGame(loadSave()||saved);});}
  if([1,2,3].some(slotMeta)){const b=document.createElement('button');b.className='btn';b.id='btnSlots';b.innerHTML=icon('save')+__L('读取存档');
    b.addEventListener('click',()=>{$('sheet').innerHTML=__L('<div class="phd"><h3>读取存档</h3><button class="x" data-act="close" aria-label="关闭">')+icon('close')+'</button></div><div class="list">'+slotRows(false)+'</div>';$('modal').hidden=false;});
    let c=mc.querySelector('.cont');if(!c){c=document.createElement('div');c.className='cont';mc.appendChild(c);}c.appendChild(b);}
  const g=$('scnGrid');g.innerHTML='';
  for(const s of K.SCENARIOS){
    const b=document.createElement('button');b.className='scn';
    const goal=s.goal?__L('目标：第')+s.goal.year+__L('年底，游客 ')+s.goal.guests+__L('+，评分 ')+s.goal.rating+'+'+(s.goal.coaster?__L('，过山车刺激度 ')+s.goal.coaster+'+':''):__L('没有目标，资金无限');
    b.innerHTML='<b>'+esc(s.name)+'</b><p>'+esc(s.desc)+'</p><span class="g">'+(s.sandbox?'':__L('起始资金 $')+K.fmt(s.money)+' · ')+goal+'</span>'+(meta.done[s.id]?__L('<span class="done">✓ 已完成</span>'):'');
    b.addEventListener('click',()=>{
      if(saved){
        $('sheet').innerHTML=__L('<div class="phd"><h3>开始「')+esc(s.name)+__L('」？</h3></div><p class="note" style="font-size:14px">会覆盖现在的存档「')+esc(saved.scnName)+__L('」。</p><div class="row"><button class="btn primary" id="okNew">开始新游戏</button><button class="btn" data-act="close">取消</button></div>');
        $('modal').hidden=false;$('okNew').addEventListener('click',()=>{closeSheet();tryFullscreen();startGame(K.newPark(s));});
      }else{tryFullscreen();startGame(K.newPark(s));}
    });
    g.appendChild(b);
  }
}
function startGame(P){
  A.P=P;A.scr='game';A.anim={};A.sel=null;A.tool=null;A.mode='inspect';A.msgSeen=P.msgSeq||0;A.speed=1;A.acc=0;P.goalShown=!!P.goalState;
  RV=0;order=null;RN=P.N;A.wxShown=null;
  K.rebuildNav(P);A.cam.z=CW<700?0.72:0.9;centerOn(P.gate.x+0.5,P.gate.y-5);
  $('menu').hidden=true;$('hud').hidden=false;$('dock').hidden=false;
  syncDock();updateHUD();saveGame(false);
  if(!P.sandbox&&P.time<1)toast(P.scnName+__L('：')+(P.goal?__L('第')+P.goal.year+__L('年底前，游客 ')+P.goal.guests+__L(' 人、评分 ')+P.goal.rating+(P.goal.coaster?__L('，还要一座刺激度 ')+P.goal.coaster+__L(' 以上的过山车'):''):''),null,5000);
}
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>{A.speed=+b.dataset.sp;updateHUD();}));
$('btnPark').addEventListener('click',()=>openSheet('overview'));
$('btnRot').addEventListener('click',()=>{setRotation(RV+1);});
$('hRating').addEventListener('click',()=>openSheet('overview'));
$('btnPortrait').addEventListener('click',()=>{document.body.classList.add('portrait-ok');resize();});
window.addEventListener('keydown',e=>{
  if(A.scr!=='game')return;
  if(e.code==='Space'){e.preventDefault();A.speed=A.speed?0:1;updateHUD();}
  else if(e.key==='Escape'){if(A.mode==='track')finishTrackMode(true);else{A.tool=null;setMode('inspect');closePanel();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(false);});
window.addEventListener('resize',resize);

/* ---------- main loop ---------- */
const STEP=0.05;let lastT=performance.now(),uiAcc=0,trackAcc=0,saveAcc=0;
function frame(now){
  const dt=Math.min(0.1,Math.max(0,(now-lastT)/1000));lastT=now;A.t+=dt;A.dt=dt;
  const P=A.P;
  if(P){
    const sp=A.scr==='menu'?1:A.speed;
    if(sp>0){A.acc+=dt*sp;let k=0;while(A.acc>=STEP&&k<24){K.tick(P,STEP);A.acc-=STEP;k++;}if(k>=24)A.acc=0;}
    updAnims(dt*sp);
    if(A.camGoal){const k=Math.min(1,dt*4);A.cam.x+=(A.camGoal.x-A.cam.x)*k;A.cam.y+=(A.camGoal.y-A.cam.y)*k;clampCam();if(Math.hypot(A.camGoal.x-A.cam.x,A.camGoal.y-A.cam.y)<1)A.camGoal=null;}
    if(A.scr==='menu'){A.cam.x+=Math.sin(A.t*0.12)*dt*14;A.cam.y+=Math.cos(A.t*0.09)*dt*6;}
  }
  render();
  uiAcc+=dt;trackAcc+=dt;saveAcc+=dt;
  if(uiAcc>0.25&&A.scr==='game'){uiAcc=0;updateHUD();refreshPanel();refreshSheet();drainMsgs();updateHint();}
  if(trackAcc>0.6&&A.mode==='track'){trackAcc=0;buildTrackbar();}
  if(A.scr==='game'&&P&&(P.saveFlag||saveAcc>45)){saveAcc=0;saveGame(false);}
  requestAnimationFrame(frame);
}
(function makeIcon(){
  try{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#8fd3ff');gr.addColorStop(1,'#d9f2ff');g.fillStyle=gr;g.fillRect(0,0,180,180);
    g.fillStyle='#7dca5d';g.fillRect(0,128,180,52);g.drawImage(previewCanvas('ride','ferris'),-8,8,196,118);
    const u=c.toDataURL('image/png');$('touchIcon').href=u;$('favIcon').href=u;}catch(e){}
})();
window.__pb={A,K,toScreen:(x,y,z)=>[(X(x,y)-A.cam.x)*A.cam.z+CW/2,(Y(x,y,z||0)-A.cam.y)*A.cam.z+CH/2]};
resize();showMenu();requestAnimationFrame(frame);

})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
